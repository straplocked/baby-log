# Process supervision for the all-in-one container. Four flat processes, no
# ordering dependencies (the API's broadcasts to Reverb are best-effort, and
# nginx returns 502s until its upstreams are up — clients just retry/poll).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# the built-in server is single-threaded per worker — PHP_CLI_SERVER_WORKERS
# (ENV, default 8) forks enough for two phones polling + writing concurrently
# (--no-reload is required for the workers to actually spawn, and nothing
# edits .env at runtime anyway)
[program:api]
command=php artisan serve --host=127.0.0.1 --port=8000 --no-reload
directory=/var/www/html
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
command=php artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/html
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# reminder pushes (feed gap / wake window / meds) ride the scheduler;
# per-minute chatter goes to /dev/null but errors stay on stderr
[program:scheduler]
command=php artisan schedule:work
directory=/var/www/html
autorestart=true
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
