# All-in-one variant of the root nginx.conf: same server block, but the API
# and Reverb live in this container, so proxy targets are loopback instead of
# the compose service names. Keep the two files in sync when editing either.
#
# NOTE: behind a reverse proxy / CDN these zones key on the proxy's address
# (instance-wide caps) unless TRUSTED_PROXIES names it — then real-ip.sh
# generates a realip block at boot and they key on the actual client.
limit_req_zone $binary_remote_addr zone=babylog_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=babylog_ws:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 1m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverb websocket (Pusher protocol)
    location /app {
        limit_conn babylog_ws 40;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Laravel API — straight to php-fpm in this container. SCRIPT_NAME is
    # pinned so Symfony resolves the base path as / (not /api). fastcgi_params
    # forwards the incoming X-Forwarded-* as-is; with TRUSTED_PROXIES set the
    # realip module has already resolved $remote_addr to the true client, and
    # REMOTE_ADDR is what Laravel's trusted-proxy handling reads first.
    location /api {
        limit_req zone=babylog_api burst=40 nodelay;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # hashed build assets can cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # the service worker must always revalidate
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
