# NOTE: behind a reverse proxy / CDN these zones key on the proxy's address,
# making them instance-wide caps — sized generously for a two-parent app while
# still stopping runaway clients.
limit_req_zone $binary_remote_addr zone=babylog_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=babylog_ws:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 1m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverb websocket (Pusher protocol)
    location /app {
        limit_conn babylog_ws 40;
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Laravel API
    location /api {
        limit_req zone=babylog_api burst=40 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hashed build assets can cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # the service worker must always revalidate
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
