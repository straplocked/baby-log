; Pool tuning for the appliance (named zzz- to sort after the base image's
; zz-docker.conf, whose listen/clear_env defaults it overrides).
[www]
; loopback only — nginx in this container is the sole client
listen = 127.0.0.1:9000
; the container's env vars ARE the app config — never scrub them
clear_env = no
; two phones polling + writing; matches the 8 workers artisan serve forked
pm = static
pm.max_children = 8
; worker stdout/stderr (Laravel's stderr log channel) must reach docker logs
catch_workers_output = yes
decorate_workers_output = no
