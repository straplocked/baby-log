# Loopback front for php-fpm: keeps this container speaking HTTP on :8000
# like `artisan serve` did, so the app container's proxy_pass and the vite
# dev proxy need no changes. Rate limiting lives in the app container's
# nginx (this one only ever sees the app proxy or the dev proxy).
server {
    listen 8000;
    server_name _;
    root /var/www/html/public;

    client_max_body_size 1m;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    # nothing else in public/ is executable
    location ~ \.php$ {
        return 404;
    }
}
