<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Baby Log</title>
  <meta name="description" content="Three taps from pocket to logged. Both of you, one log." />
  <meta name="theme-color" content="#FAF6EF" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/duck.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Baby Log" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=block" rel="stylesheet" />
  <script>
    // pre-paint dark check so a dark-mode launch never flashes cream;
    // src/fx.js owns this decision once the app is up
    try {
      var m = (JSON.parse(localStorage.getItem('babylog:fx')) || {}).mode || 'auto'
      var dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) document.documentElement.classList.add('dark')
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
    } catch (e) { /* default light */ }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
